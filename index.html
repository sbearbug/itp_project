<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f4f6" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('campus-theme-mode') || 'system';
          const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          let theme = localStorage.getItem('campus-theme-name');
          if (!theme) {
            const legacy = dark
              ? (localStorage.getItem('campus-theme-dark') || 'graphite')
              : (localStorage.getItem('campus-theme-light') || localStorage.getItem('campus-theme-palette') || 'mist');
            theme = legacy === 'cyan' || legacy === 'ice-dark' ? 'ice' : legacy === 'graphite' ? 'mist' : legacy;
          }
          if (!['mist', 'ice', 'moss', 'sunny'].includes(theme)) theme = 'mist';
          document.documentElement.dataset.theme = `${theme}-${dark ? 'dark' : 'light'}`;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.dataset.theme = 'mist-light';
        }
      })();
    </script>
    <title>校园活动助手</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
