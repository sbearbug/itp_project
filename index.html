<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f6" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('campus-theme-mode') || 'system';
          const legacy = localStorage.getItem('campus-theme-palette');
          const savedLight = localStorage.getItem('campus-theme-light') || legacy || 'mist';
          const lightTheme = savedLight === 'cyan' ? 'ice' : savedLight;
          const darkTheme = localStorage.getItem('campus-theme-dark') || 'graphite';
          const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? darkTheme : lightTheme;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.dataset.theme = 'mist';
        }
      })();
    </script>
    <title>校园活动助手</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
