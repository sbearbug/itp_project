<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 地面投影 -->
  <ellipse cx="120" cy="162" rx="72" ry="6" fill="var(--surface-2)"/>



  <!-- 台历本体：纸张厚度 -->
  <path d="M72 150 L72 154 Q72 157 75 157 L165 157 Q168 157 168 154 L168 150" stroke="var(--text-2)" stroke-width="2" fill="var(--surface-2)"/>
  <!-- 当前空白页 -->
  <rect x="72" y="44" width="96" height="108" rx="6" fill="var(--surface)" stroke="var(--text-2)" stroke-width="2"/>
  <!-- 前一页被撕下后，留在装订条下的不规则残边 -->
  <path d="M74 47 L166 47 L166 54.62 L162.5 56.42 L159 53.95 L154 57.1 L151 54.62 L146.5 55.98 L143 53.5 L138 57.33 L135 54.85 L130 56.2 L127 53.73 L122.5 56.88 L118 54.4 L114.5 55.75 L110 53.5 L105 57.33 L102 54.62 L97.5 56.42 L94 53.95 L89 57.1 L86 54.4 L81.5 56.2 L78 53.73 L74 55.52 Z" fill="var(--surface)" stroke="var(--date-bg)" stroke-width="1.5"/>
  <!-- 撕线 -->
  <line x1="80" y1="70" x2="160" y2="70" stroke="var(--date-bg)" stroke-width="2" stroke-dasharray="1 5"/>
  <!-- 日期位置：空着 -->
  <rect x="101" y="88" width="38" height="34" rx="6" stroke="var(--date-bg)" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- 装订条与圆环 -->
  <rect x="66" y="30" width="108" height="18" rx="5" fill="var(--surface-2)" stroke="var(--text-2)" stroke-width="2"/>
  <rect x="94" y="21" width="7" height="17" rx="3.5" fill="var(--surface)" stroke="var(--text-2)" stroke-width="2"/>
  <rect x="139" y="21" width="7" height="17" rx="3.5" fill="var(--surface)" stroke="var(--text-2)" stroke-width="2"/>
</svg>
